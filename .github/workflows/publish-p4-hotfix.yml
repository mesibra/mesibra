name: Publish P4 Hotfix Firmware

on:
  push:
    paths:
      - '.github/workflows/publish-p4-hotfix.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified private CI artifact once
        env:
          ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-d9a4-81f4-b35b-3616ac11db65/raw?se=2026-09-05T14%3A35%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=f3c9e076-c8c0-569f-ba4e-908c554ecb9f&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T08%3A08%3A18Z&ske=2026-09-06T08%3A08%3A18Z&sks=b&skv=2026-02-06&sig=wGKLxWdcD8MRQboRacn9SRGO1GTMhcIzfkxGZ11k7jE%3D"
          EXPECTED_SHA256: "31a4d0b2d430e3a86ac5350a3c7d79f614551fa4f7310a748dc76ae3b3a033f6"
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/p4-artifact.zip
          echo "$EXPECTED_SHA256  /tmp/p4-artifact.zip" | sha256sum -c -
          rm -rf /tmp/p4-fw
          mkdir -p /tmp/p4-fw
          unzip -q /tmp/p4-artifact.zip -d /tmp/p4-fw

      - name: Publish only flash-required binaries
        run: |
          set -euo pipefail
          out="coolsmart/firmware/p4-c960ee6"
          rm -rf "$out"
          mkdir -p "$out/bootloader" "$out/partition_table"
          cp /tmp/p4-fw/bootloader/bootloader.bin "$out/bootloader/bootloader.bin"
          cp /tmp/p4-fw/partition_table/partition-table.bin "$out/partition_table/partition-table.bin"
          cp /tmp/p4-fw/ota_data_initial.bin "$out/ota_data_initial.bin"
          cp /tmp/p4-fw/CoolSmartP4Monitor.bin "$out/CoolSmartP4Monitor.bin"
          cp /tmp/p4-fw/storage.bin "$out/storage.bin"
          cp /tmp/p4-fw/commit.txt "$out/commit.txt"
          (cd "$out" && sha256sum bootloader/bootloader.bin partition_table/partition-table.bin ota_data_initial.bin CoolSmartP4Monitor.bin storage.bin > SHA256SUMS.txt)

      - name: Commit permanent public firmware files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coolsmart/firmware/p4-c960ee6
          git commit -m "Publish permanent P4 c960ee6 hotfix firmware [skip ci]" || exit 0
          git push
