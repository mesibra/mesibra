name: Publish P4 f863a67 Firmware

on:
  push:
    paths:
      - '.github/workflows/publish-p4-f863a67.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified CI artifact
        env:
          ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-aacc-8210-8c87-848be86142bf/raw?se=2026-09-05T20%3A07%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=aaefc3fd-0add-5b60-9268-44361e6131ba&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T05%3A43%3A41Z&ske=2026-09-06T05%3A43%3A41Z&sks=b&skv=2026-02-06&sig=PWNRBjjdX5guEEVy/y5AfDM18fgA%2BzNp1wjHWxLry5g%3D"
        run: |
          set -Eeuo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          echo "a845d79376d6d0f8b1ba5cd17b6af7d973522e07064300d509f787bc57afcc30  artifact.zip" | sha256sum -c -

      - name: Verify and publish permanent firmware files
        run: |
          set -Eeuo pipefail
          rm -rf artifact
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test "$(cat artifact/commit.txt)" = "f863a67b9510f2c9a6181e092aaa32dd81fc9d0d"
          (cd artifact && sha256sum -c SHA256SUMS.txt)
          dest="coolsmart/firmware/p4-f863a67"
          mkdir -p "$dest/bootloader" "$dest/partition_table"
          cp artifact/bootloader/bootloader.bin "$dest/bootloader/"
          cp artifact/partition_table/partition-table.bin "$dest/partition_table/"
          cp artifact/ota_data_initial.bin "$dest/"
          cp artifact/CoolSmartP4Monitor.bin "$dest/"
          cp artifact/storage.bin "$dest/"
          cp artifact/commit.txt "$dest/"
          cp artifact/flash_args "$dest/"
          ( cd "$dest" && sha256sum bootloader/bootloader.bin partition_table/partition-table.bin ota_data_initial.bin CoolSmartP4Monitor.bin storage.bin > SHA256SUMS.txt )

      - name: Commit permanent public firmware
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coolsmart/firmware/p4-f863a67
          git commit -m "Publish P4 stable Ethernet firmware f863a67"
          git push
