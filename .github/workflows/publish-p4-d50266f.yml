name: Publish P4 d50266f Firmware

on:
  push:
    paths:
      - '.github/workflows/publish-p4-d50266f.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified private CI artifact once
        env:
          ARTIFACT_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-1ae4-8243-a0bd-e7fff0168600/raw?se=2026-09-05T15%3A29%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=6707b0f7-fb06-57fb-a12d-615e2607cc8c&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T07%3A22%3A26Z&ske=2026-09-06T07%3A22%3A26Z&sks=b&skv=2026-02-06&sig=MRPLv657RwBvOCpDqcfZFD1YDMx%2BIktiI8/%2BgOwIKrA%3D"
          EXPECTED_SHA256: "a5b913a8f7756a9fcb25a76bf42924801fa1418569cfd614c46adfaf34a6504f"
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/p4-artifact.zip
          echo "$EXPECTED_SHA256  /tmp/p4-artifact.zip" | sha256sum -c -
          rm -rf /tmp/p4-fw
          mkdir -p /tmp/p4-fw
          unzip -q /tmp/p4-artifact.zip -d /tmp/p4-fw

      - name: Verify commit and publish flash-required binaries
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < /tmp/p4-fw/commit.txt)" = "d50266fdd2f11fcdfb299438cd91b93a94f73249"
          out="coolsmart/firmware/p4-d50266f"
          rm -rf "$out"
          mkdir -p "$out/bootloader" "$out/partition_table"
          cp /tmp/p4-fw/bootloader/bootloader.bin "$out/bootloader/bootloader.bin"
          cp /tmp/p4-fw/partition_table/partition-table.bin "$out/partition_table/partition-table.bin"
          cp /tmp/p4-fw/ota_data_initial.bin "$out/ota_data_initial.bin"
          cp /tmp/p4-fw/CoolSmartP4Monitor.bin "$out/CoolSmartP4Monitor.bin"
          cp /tmp/p4-fw/storage.bin "$out/storage.bin"
          cp /tmp/p4-fw/commit.txt "$out/commit.txt"
          (cd "$out" && sha256sum bootloader/bootloader.bin partition_table/partition-table.bin ota_data_initial.bin CoolSmartP4Monitor.bin storage.bin > SHA256SUMS.txt)

      - name: Commit permanent public firmware files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coolsmart/firmware/p4-d50266f
          git commit -m "Publish permanent P4 d50266f firmware [skip ci]" || exit 0
          git push
