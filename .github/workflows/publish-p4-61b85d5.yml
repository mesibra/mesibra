name: Publish P4 61b85d5 Firmware

on:
  push:
    paths:
      - '.github/workflows/publish-p4-61b85d5.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified private CI artifact once
        env:
          ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-8b34-81f4-abd2-7a41a2c2d3d3/raw?se=2026-09-05T18%3A11%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=354b857b-9b28-5b8d-b074-38102d96e50c&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T06%3A12%3A44Z&ske=2026-09-06T06%3A12%3A44Z&sks=b&skv=2026-02-06&sig=7cK8j6h98WIwqgqtCzU84%2BRB/VWbQQ0tbukuL1ZJ6jg%3D"
          EXPECTED_SHA256: "22302185563492cd28b08ba883535920e8f593cd0e13a82e218b1d477f8ebcd2"
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/p4-artifact.zip
          echo "$EXPECTED_SHA256  /tmp/p4-artifact.zip" | sha256sum -c -
          rm -rf /tmp/p4-fw
          mkdir -p /tmp/p4-fw
          unzip -q /tmp/p4-artifact.zip -d /tmp/p4-fw

      - name: Verify commit and publish flash-required binaries
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < /tmp/p4-fw/commit.txt)" = "61b85d548bc9cce1bec8eaa8f201e8ed3914475f"
          out="coolsmart/firmware/p4-61b85d5"
          rm -rf "$out"
          mkdir -p "$out/bootloader" "$out/partition_table"
          cp /tmp/p4-fw/bootloader/bootloader.bin "$out/bootloader/bootloader.bin"
          cp /tmp/p4-fw/partition_table/partition-table.bin "$out/partition_table/partition-table.bin"
          cp /tmp/p4-fw/ota_data_initial.bin "$out/ota_data_initial.bin"
          cp /tmp/p4-fw/CoolSmartP4Monitor.bin "$out/CoolSmartP4Monitor.bin"
          cp /tmp/p4-fw/storage.bin "$out/storage.bin"
          cp /tmp/p4-fw/commit.txt "$out/commit.txt"
          (cd "$out" && sha256sum bootloader/bootloader.bin partition_table/partition-table.bin ota_data_initial.bin CoolSmartP4Monitor.bin storage.bin > SHA256SUMS.txt)

      - name: Commit permanent public firmware files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coolsmart/firmware/p4-61b85d5
          git commit -m "Publish permanent P4 61b85d5 firmware [skip ci]" || exit 0
          git push
