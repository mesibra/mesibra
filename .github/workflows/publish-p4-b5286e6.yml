name: Publish P4 b5286e6 firmware

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-p4-b5286e6.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-c218-8210-92ba-ad21f869737c/raw?se=2026-09-05T23%3A13%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=bec36ef1-2a91-5d7a-9462-1c11602ab4c0&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T22%3A25%3A24Z&ske=2026-09-06T22%3A25%3A24Z&sks=b&skv=2026-02-06&sig=df4c/8wkEExtuhKLVvkzWLpjHT2WsopAkrleSLK8Uso%3D'
      ZIP_SHA256: 'f29c78ae9ac2b2d93fc0c7e334f7a8b7197846490cb8853880a4e2b22ad8101e'
      EXPECTED_COMMIT: 'b5286e683dc9adc3d1227cfd1bb19319918349ed'
      DEST: 'coolsmart/firmware/p4-b5286e6'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify validated CI artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o /tmp/fw.zip
          echo "$ZIP_SHA256  /tmp/fw.zip" | sha256sum -c -
          rm -rf /tmp/fw && mkdir -p /tmp/fw
          unzip -q /tmp/fw.zip -d /tmp/fw
          cd /tmp/fw
          test "$(tr -d '\r\n' < commit.txt)" = "$EXPECTED_COMMIT"
          sha256sum -c SHA256SUMS.txt

      - name: Publish permanent firmware files
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$DEST"
          mkdir -p "$DEST/bootloader" "$DEST/partition_table"
          cp /tmp/fw/bootloader/bootloader.bin "$DEST/bootloader/"
          cp /tmp/fw/partition_table/partition-table.bin "$DEST/partition_table/"
          cp /tmp/fw/ota_data_initial.bin "$DEST/"
          cp /tmp/fw/CoolSmartP4Monitor.bin "$DEST/"
          cp /tmp/fw/storage.bin "$DEST/"
          cp /tmp/fw/commit.txt "$DEST/"
          cp /tmp/fw/flash_args "$DEST/"
          cat > "$DEST/SHA256SUMS.txt" <<'EOF'
          5b9de605b820f4d941890e4ff54779c8813bd9c61aca341ba747a4026a764009  bootloader/bootloader.bin
          3ba490af9dac62e05c22ca5a124018f5fdca958ffd1a767bb90eae7b558400df  partition_table/partition-table.bin
          7d2c7ac4888bfd75cd5f56e8d61f69595121183afc81556c876732fd3782c62f  ota_data_initial.bin
          7b09d0d66215f86c7f51c3b45f38d13462cc6fbc9ad10f5d3da5f74d7285a648  CoolSmartP4Monitor.bin
          c1ec6e89a70576f5f8786c56a834aa6589a2f0bb801d0bd30e76922df17ffec1  storage.bin
          EOF
          (cd "$DEST" && sha256sum -c SHA256SUMS.txt)

      - name: Commit permanent firmware
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          if git diff --cached --quiet; then
            echo 'Firmware already published.'
            exit 0
          fi
          git commit -m 'Publish P4 simple C6 monitor b5286e6'
          git push
